name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify (kompilacja, testy, enforcer)
        run: mvn -B verify
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: jenkins/scripts
